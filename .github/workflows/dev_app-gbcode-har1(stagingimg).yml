# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcode-har1

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crhar.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_31A54D36BBF44E82917B94311557500A }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_9F0C3AAB3C3547D6AAEC3494695A1739 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crhar.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_31A54D36BBF44E82917B94311557500A }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcode-har1'
          slot-name: 'stagingimg'
          images: 'crhar.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_31A54D36BBF44E82917B94311557500A }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_29770A1F0C674E5289AEC495648CDD63 }}